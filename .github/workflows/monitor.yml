name: Tee Time Monitor

on:
  schedule:
    # Runs every 20 minutes, 6 AM – 10 PM ET (UTC-5), Mon–Fri
    # GitHub Actions uses UTC, so ET+5 hours:
    #   6 AM ET  = 11 AM UTC    7 PM ET = 12 AM UTC (next day)
    # Cron format: minute hour day month day-of-week
    - cron: "0,20,40 11-23 * * 1-5"   # Every 20 min, 11:00–23:40 UTC (Mon–Fri)
    - cron: "0,20,40 0    * * 2-6"    # And the midnight hour rollovers

  workflow_dispatch:  # Also allows manual trigger from the GitHub UI

jobs:
  check-tee-times:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore tee time cache
        uses: actions/cache@v4
        with:
          path: last_teetimes.json
          key: teetime-cache-${{ hashFiles('monitor.py') }}
          restore-keys: teetime-cache-

      - name: Run monitor
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save updated cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_teetimes.json
          key: teetime-cache-${{ hashFiles('monitor.py') }}-${{ github.run_id }}
