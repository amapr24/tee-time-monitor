name: Check Tee Times

on:
  schedule:
    # 1. Every 5 mins from 12:00 PM UTC to 11:59 PM UTC (7 AM - 6:59 PM EST)
    - cron: '*/5 12-23 * * *'
    
    # 2. Every 5 mins from 12:00 AM UTC to 6:00 AM UTC (7 PM - 1 AM EST)
    - cron: '*/5 0-6 * * *'
    
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  check-tee-times:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps
      
      - name: Cache tee times data
        uses: actions/cache@v4
        with:
          path: last_teetimes.json
          key: teetime-cache-${{ hashFiles('monitor.py') }}
          restore-keys: teetime-cache-
      
      - name: Run monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Add these two new ones:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: python monitor.py

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s \
            --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER_KEY }}" \
            --form-string "message=⚠️ Tee Time Monitor crashed or failed to run!" \
            https://api.pushover.net/1/messages.json
