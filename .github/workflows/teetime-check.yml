name: Check Tee Times

on:
  schedule:
    # Runs every 5 mins from 7 AM to 6:59 PM EST (12:00 - 23:55 UTC)
    - cron: '*/5 12-23 * * *'
    # Runs every 5 mins from 7 PM to 1:00 AM EST (00:00 - 06:00 UTC)
    - cron: '*/5 0-6 * * *'
  workflow_dispatch:

jobs:
  check-tee-times:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: last_teetimes.json
          # FIXED: Using a static key so cache is shared between runs.
          # Change 'v1' to 'v2' if you ever want to force a reset.
          key: teetime-cache-v1
          restore-keys: teetime-cache-

      - name: Run monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: python monitor.py
