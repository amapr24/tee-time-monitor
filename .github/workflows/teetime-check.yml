name: Check Tee Times

on:
  schedule:
    - cron: '*/5 12-23 * * *' # 7 AM - 7 PM EST
    - cron: '*/5 0-6 * * *'   # 7 PM - 1 AM EST
  workflow_dispatch:

jobs:
  check-tee-times:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: last_teetimes.json
          # FIXED: Using a static key so GitHub remembers the file between runs
          key: teetime-cache-v1
          restore-keys: teetime-cache-

      - name: Run monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: python monitor.py
