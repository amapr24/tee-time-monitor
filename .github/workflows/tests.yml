name: Tests

on:
  pull_request:
  push:
    branches: [main, production]
    # Generated-output commits (PAT pushes every ~10 min) don't need pytest.
    paths-ignore:
      - index.html
      - data.json
      - version.json

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q
