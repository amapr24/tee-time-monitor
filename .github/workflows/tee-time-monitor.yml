name: Tee Time Monitor Miami

on:
  workflow_dispatch:  # triggered externally by cron-job.org

# Only one run at a time, and runs are never cancelled mid-flight (a cancelled
# run could lose a scrape that already happened). Note: GitHub keeps at most
# ONE pending run per group — while a run executes, a newer dispatch replaces
# the queued one, so some 10-minute cron triggers are dropped by design. The
# job timeout below caps how long a hung run can block the group.
concurrency:
  group: tee-time-monitor
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit index.html back to repo

jobs:
  check-tee-times:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Keyed on requirements.txt so a dependency bump invalidates the cache
      # (a static key freezes after its first save — actions/cache only saves
      # on a miss — and would serve stale packages forever).
      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # ── Cache strategy ────────────────────────────────────────────────────
      # Restore using a prefix so we always get the most recent cache entry.
      # Save with a unique key (run_id) so GitHub actually writes the update.
      # A static key like "teetime-cache-v1" silently stops updating after
      # the very first run because GitHub won't overwrite an existing key.
      - name: Restore tee time cache
        uses: actions/cache/restore@v5
        with:
          path: |
            cache_miami_lakes.json
            cache_normandy.json
            cache_miami_shores.json
            cache_miami_beach.json
            cache_plantation.json
          key: teetime-cache-${{ github.run_id }}   # won't match — intentional
          restore-keys: teetime-cache-               # grabs the latest saved entry

      - name: Run monitor
        env:
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          python tee_time_monitor.py

      - name: Save updated cache
        uses: actions/cache/save@v5
        if: always()   # save even if the script finds 0 slots
        with:
          path: |
            cache_miami_lakes.json
            cache_normandy.json
            cache_miami_shores.json
            cache_miami_beach.json
            cache_plantation.json
          key: teetime-cache-${{ github.run_id }}

      - name: Commit and push generated output (index.html, data.json, version.json)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html version.json data.json
          git diff --staged --quiet || git commit -m "Update tee times"
          # -X theirs: a queued run starts from the SHA resolved at dispatch
          # time, so when a slow run outlasts the cron interval the next run
          # rebases its regenerated files over the previous run's commit —
          # conflicting on every line. Always resolve in favor of this run's
          # (newer) output.
          git pull --rebase -X theirs
          git push
