<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tee Time Watch · Miami</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d2e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: "Courier New", Courier, monospace;
      color: #e8d9a0;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Spinning golf ball */
    .ball {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #fff 60%, #d4d4d4 100%);
      box-shadow: inset -4px -4px 8px rgba(0,0,0,0.25), 0 4px 18px rgba(0,0,0,0.4);
      animation: spin 1.4s linear infinite;
      position: relative;
    }
    .ball::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(
        transparent 0deg 20deg,
        rgba(180,180,180,0.18) 20deg 22deg
      );
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .error-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      max-width: 340px;
      padding: 0 20px;
    }
    .error-box .icon { font-size: 2.4rem; }
    .error-box .msg  { font-size: 0.85rem; line-height: 1.6; opacity: 0.8; }
    .error-box .retry-btn {
      margin-top: 6px;
      background: transparent;
      border: 1px solid #c8a84b;
      color: #c8a84b;
      padding: 8px 22px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .error-box .retry-btn:hover { background: rgba(200,168,75,0.12); }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="ball"></div>
    <div class="label">Loading tee times…</div>
  </div>

  <div class="error-box" id="error-box">
    <div class="icon">⛳</div>
    <div class="msg" id="error-msg">Could not load tee time data.</div>
    <button class="retry-btn" onclick="loadContent()">RETRY ↺</button>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────────
    // Update OWNER and REPO to match your GitHub repository.
    const OWNER  = 'YOUR_GITHUB_USERNAME';
    const REPO   = 'YOUR_REPO_NAME';
    const BRANCH = 'dev';
    const FILE   = 'tee_times.html';

    // GitHub raw URL — no auth needed for public repos.
    // Bust the CDN cache with a timestamp so we always get the latest commit.
    function rawUrl() {
      return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}?t=${Date.now()}`;
    }

    async function loadContent() {
      document.getElementById('loader').style.display    = 'flex';
      document.getElementById('error-box').style.display = 'none';

      try {
        const res = await fetch(rawUrl());

        if (!res.ok) {
          throw new Error(`HTTP ${res.status} — ${res.statusText}`);
        }

        const html = await res.text();

        // Replace the entire document with the fetched page.
        // This preserves every script, style, and element exactly as generated.
        document.open();
        document.write(html);
        document.close();

      } catch (err) {
        console.error('[tee-time-shell] fetch failed:', err);
        document.getElementById('loader').style.display    = 'none';
        document.getElementById('error-box').style.display = 'flex';
        document.getElementById('error-msg').textContent  =
          `Could not load tee time data.\n${err.message}`;
      }
    }

    loadContent();
  </script>

</body>
</html>
